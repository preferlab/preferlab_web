
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>세상 모든 거절 생성기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

    color: #333;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,0.95),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #eef1f4,
            #dfe4e8,
            #f6f7f8
        );

    padding: 25px 15px 60px;
}


/* =========================
   홈 버튼
========================= */

.home-button {
    position: fixed;
    top: 18px;
    left: 18px;

    width: 44px;
    height: 44px;

    border-radius: 50%;

    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(0,0,0,0.07);

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    font-size: 21px;

    transition: 0.2s;

    z-index: 10;
}

.home-button:hover {
    transform: translateY(-2px);
}


/* =========================
   전체 영역
========================= */

.container {
    width: 100%;
    max-width: 760px;

    margin: 55px auto 0;
}


/* =========================
   제목
========================= */

.title-area {
    text-align: center;

    margin-bottom: 35px;
}

.title-area h1 {
    margin: 0;

    font-size: clamp(30px, 6vw, 46px);

    font-weight: 800;

    letter-spacing: -2px;
}

.title-area p {
    margin: 12px 0 0;

    color: #777;

    font-size: 14px;
}


/* =========================
   설문 카드
========================= */

.survey-card {
    background: rgba(255,255,255,0.94);

    border-radius: 24px;

    padding: 30px;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.07);

    border: 1px solid rgba(255,255,255,0.9);
}


/* =========================
   질문
========================= */

.question {
    margin-bottom: 30px;
}

.question:last-child {
    margin-bottom: 5px;
}

.question-title {
    font-size: 17px;

    font-weight: 750;

    margin-bottom: 13px;
}

.question-number {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    width: 27px;
    height: 27px;

    margin-right: 7px;

    border-radius: 50%;

    background: #e9ecef;

    color: #555;

    font-size: 13px;
}


/* =========================
   선택 버튼
========================= */

.options {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(110px, 1fr));

    gap: 9px;
}

.option input {
    display: none;
}

.option label {
    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 48px;

    padding: 10px 13px;

    border-radius: 13px;

    border: 1px solid #dfe2e5;

    background: #fafafa;

    color: #666;

    font-size: 14px;

    cursor: pointer;

    transition: 0.2s;

    text-align: center;
}

.option label:hover {
    background: #f1f3f5;

    border-color: #cdd2d7;
}

.option input:checked + label {
    background: #555;

    color: white;

    border-color: #555;

    box-shadow:
        0 4px 10px rgba(0,0,0,0.12);
}


/* =========================
   생성 버튼
========================= */

.generate-button {
    width: 100%;

    margin-top: 30px;

    border: none;

    border-radius: 15px;

    padding: 17px;

    background: #333;

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;
}

.generate-button:hover {
    background: #222;

    transform: translateY(-1px);
}

.generate-button:active {
    transform: translateY(1px);
}


/* =========================
   오류
========================= */

.error-message {
    display: none;

    margin-top: 15px;

    padding: 13px;

    background: #f8eeee;

    color: #a35d5d;

    border-radius: 12px;

    text-align: center;

    font-size: 13px;
}


/* =========================
   결과
========================= */

.result-area {
    display: none;

    margin-top: 22px;

    background: rgba(255,255,255,0.95);

    border-radius: 24px;

    padding: 28px;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.07);
}

.result-label {
    font-size: 13px;

    color: #999;

    margin-bottom: 12px;
}

.result-text {
    font-size: 18px;

    line-height: 1.8;

    color: #333;

    font-weight: 500;

    padding: 22px;

    background: #f7f7f7;

    border-radius: 16px;

    min-height: 90px;

    display: flex;

    align-items: center;
}

.result-buttons {
    display: flex;

    gap: 10px;

    margin-top: 15px;
}

.result-buttons button {
    flex: 1;

    border: none;

    border-radius: 12px;

    padding: 13px;

    font-size: 14px;

    font-weight: 650;

    cursor: pointer;

    transition: 0.2s;
}

.copy-button {
    background: #e9ecef;

    color: #444;
}

.copy-button:hover {
    background: #dde1e5;
}

.regenerate-button {
    background: #555;

    color: white;
}

.regenerate-button:hover {
    background: #3f3f3f;
}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    body {
        padding: 20px 12px 45px;
    }

    .home-button {
        top: 12px;
        left: 12px;
    }

    .container {
        margin-top: 65px;
    }

    .survey-card,
    .result-area {
        padding: 22px;

        border-radius: 20px;
    }

    .title-area h1 {
        font-size: 31px;
    }

    .options {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .result-text {
        font-size: 16px;

        line-height: 1.7;
    }

    .result-buttons {
        flex-direction: column;
    }
}

</style>
</head>

     홈

/* =======================================================
   랜덤 선택
======================================================= */

function randomItem(array) {

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


/* =======================================================
   문장 생성
======================================================= */

function generateRefusal() {

    const tone =
        document.querySelector(
            'input[name="tone"]:checked'
        );

    const situation =
        document.querySelector(
            'input[name="situation"]:checked'
        );

    const apology =
        document.querySelector(
            'input[name="apology"]:checked'
        );

    const strength =
        document.querySelector(
            'input[name="strength"]:checked'
        );

    const length =
        document.querySelector(
            'input[name="length"]:checked'
        );


    /* ---------------------------
       모든 항목 선택 확인
    --------------------------- */

    if (
        !tone ||
        !situation ||
        !apology ||
        !strength ||
        !length
    ) {

        document.getElementById(
            "errorMessage"
        ).style.display = "block";

        return;
    }


    document.getElementById(
        "errorMessage"
    ).style.display = "none";


    const toneValue = tone.value;
    const situationValue = situation.value;
    const apologyValue = apology.value;
    const strengthValue = strength.value;
    const lengthValue = length.value;


    /*
    =======================================================
    핵심

    말투에 따라 완전히 다른 데이터베이스를 선택합니다.

    반말
    ↓
    casualData

    존댓말
    ↓
    politeData

    극존칭
    ↓
    formalData

    따라서 존댓말 문장이 반말 데이터에 들어갈 수 없습니다.
    =======================================================
    */

    let selectedData;


    if (toneValue === "반말") {

        selectedData = casualData;

    }

    else if (toneValue === "존댓말") {

        selectedData = politeData;

    }

    else {

        selectedData = formalData;

    }


    /*
    강도
    ↓
    사과 여부
    ↓
    문장 길이
    */

    let sentenceList =
        selectedData
            [strengthValue]
            [apologyValue]
            [lengthValue];


    /*
    안전장치
    */

    if (
        !sentenceList ||
        sentenceList.length === 0
    ) {

        sentenceList = [
            "이번에는 어려울 것 같습니다."
        ];

    }


    /*
    같은 문장이 연속으로 나오는 것을 방지
    */

    const previousText =
        document.getElementById(
            "resultText"
        ).innerText;


    let sentence;

    let attempts = 0;


    do {

        sentence =
            randomItem(sentenceList);

        attempts++;

    } while (
        sentence === previousText &&
        sentenceList.length > 1 &&
        attempts < 20
    );


    /*
    =======================================================
    상황별 추가 표현

    단, 문장 길이가 "짧게"인 경우에는
    별도 표현을 붙이지 않습니다.
    =======================================================
    */

    if (
        lengthValue !== "짧게" &&
        Math.random() < 0.35
    ) {

        const endingList =
            situationEnding
                [situationValue]
                [toneValue];


        sentence +=
            randomItem(endingList);

    }


    /*
    =======================================================
    사과 여부 최종 안전장치

    "안 한다"를 선택했는데 문장에
    죄송 / 미안 등의 표현이 포함된 데이터가 있으면
    제거하는 것이 아니라 해당 데이터 자체를
    사용하지 않도록 데이터베이스를 분리했습니다.

    즉 이 단계에서는 문장을 강제로 변형하지 않습니다.
    =======================================================
    */


    /* 결과 출력 */

    document.getElementById(
        "resultText"
    ).innerText = sentence;


    document.getElementById(
        "resultArea"
    ).style.display = "block";


    /*
    결과 위치로 이동
    */

    setTimeout(() => {

        document.getElementById(
            "resultArea"
        ).scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 100);

}


/* =======================================================
   복사
======================================================= */

async function copyResult() {

    const text =
        document.getElementById(
            "resultText"
        ).innerText;


    if (!text) {
        return;
    }


    try {

        await navigator.clipboard.writeText(text);


        const button =
            document.querySelector(
                ".copy-button"
            );


        button.innerText =
            "✓ 복사되었습니다";


        setTimeout(() => {

            button.innerText =
                "📋 복사하기";

        }, 1500);


    }

    catch (error) {

        const textarea =
            document.createElement("textarea");


        textarea.value = text;

        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        try {

            document.execCommand(
                "copy"
            );


            const button =
                document.querySelector(
                    ".copy-button"
                );


            button.innerText =
                "✓ 복사되었습니다";


            setTimeout(() => {

                button.innerText =
                    "📋 복사하기";

            }, 1500);

        }

        catch (e) {

            alert(
                "복사하지 못했습니다. 문장을 직접 복사해주세요."
            );

        }


        document.body.removeChild(
            textarea
        );

    }

}
