        font-size: 23px;

        transition: .2s;
        z-index: 100;
    }

    .home:hover {
        transform: scale(1.08);

    .question-title {

    }

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
    }

    .option {
        position: relative;
    }

    .option input {
        position: absolute;
        opacity: 0;
    }

    .option label {
        display: flex;
        align-items: center;
        justify-content: center;

        min-height: 52px;
        padding: 10px;

        border-radius: 15px;
        background: #faf8fc;
        border: 2px solid #eee7f1;

        cursor: pointer;
        text-align: center;
        font-size: 14px;
        font-weight: 650;

        transition: .18s;
    }

    .option label:hover {
        transform: translateY(-2px);
        border-color: #d8b9e6;
        background: #fff;
    }

    .option input:checked + label {
        border-color: #a875bd;
        background: #f4e7fa;
        color: #653c77;
        box-shadow: 0 4px 12px rgba(150,100,180,.15);
    }

    .option input:disabled + label {
        opacity: .55;
        cursor: not-allowed;
        transform: none;
    }

        text-align: center;

    }

        cursor: pointer;
        transition: .2s;
    }

    #recommendBtn:hover {
        transform: translateY(-3px) scale(1.02);
    }

    #recommendBtn:active {
        transform: scale(.97);
    }

    .results {

    }

        font-size: 21px;
        font-weight: 900;

    }

    }

        font-size: 12px;
    }

</style>
</head>

/* =========================================================
   혼밥 선택 시 4번 자동 변경
   ========================================================= */

const alone = document.getElementById("alone");

alone.addEventListener("change", function() {

    const people2 = document.getElementById("people2");
    const allPeople = document.querySelectorAll('input[name="people"]');

    if (this.checked) {

        people2.checked = true;

        allPeople.forEach(input => {
            if (input !== people2) {
                input.disabled = true;
                input.checked = false;
            }
        });

        document.getElementById("aloneMessage").style.display = "block";

    }
});


/* 다른 동행자를 선택하면 4번 잠금 해제 */

document.querySelectorAll('input[name="company"]').forEach(input => {

    input.addEventListener("change", function() {

        if (this.value !== "혼밥") {

            document.querySelectorAll('input[name="people"]').forEach(input => {
                input.disabled = false;
            });

            document.getElementById("aloneMessage").style.display = "none";
        }

    });

});


/* =========================================================
   랜덤 섞기
   ========================================================= */

function shuffle(array) {

    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}

            people.value === "6인 이상";

        const typeMatch =
            foodTypes.includes(food.type);

        const priceMatch =
            prices.includes(food.price);


        return timeMatch &&
               companyMatch &&
               typeMatch &&
               priceMatch;
    });


    /* =====================================================
       후보가 너무 적으면 조건을 조금 완화
       ===================================================== */

    if (candidates.length < 3) {

        candidates = foods.filter(food => {

            const timeMatch =
                food.meal.includes(mealTime.value);

            const typeMatch =
                foodTypes.includes(food.type);

            const priceMatch =
                prices.includes(food.price);

            return timeMatch && typeMatch && priceMatch;
        });
    }


    /* 그래도 적으면 가격 조건 완화 */

    if (candidates.length < 3) {

        candidates = foods.filter(food => {

            const timeMatch =
                food.meal.includes(mealTime.value);

            const typeMatch =
                foodTypes.includes(food.type);

            return timeMatch && typeMatch;
        });
    }


    /* 기타를 선택했다면 기타 음식 우선 */

    if (foodTypes.includes("기타")) {

        const unusual = candidates.filter(food =>
            food.type === "기타"
        );

        if (unusual.length >= 3) {

            candidates = unusual;
        }
    }


    /* 랜덤으로 섞기 */

    candidates = shuffle(candidates);


    /* 같은 음식이 반복되는 것을 줄이기 위해
       직전 추천 음식 제외 */

    if (window.lastRecommended) {

        const filtered =
            candidates.filter(food =>
                !window.lastRecommended.includes(food.name)
            );

        if (filtered.length >= 3) {
            candidates = filtered;
        }
    }


    const selected = candidates.slice(0, 3);


    window.lastRecommended =
        selected.map(food => food.name);


    /* =====================================================
       결과 출력
       ===================================================== */

    const results =
        document.getElementById("results");

    results.innerHTML = "";


    const title =
        document.createElement("div");

    title.className = "results-title";

    title.innerHTML =
        "🎉 오늘의 추천 메뉴";

    results.appendChild(title);


    selected.forEach((food, index) => {

        const card =
            document.createElement("div");

        card.className = "food-card";

        card.innerHTML = `

            <div class="food-name">
                ${index + 1}. ${food.name}
            </div>

            <div class="food-category">
                ${food.type}
            </div>

            <div class="food-info">
                ${food.reason}
            </div>

            <div class="food-price">
                💰 예상 가격대 : ${food.range}
            </div>

        `;

        results.appendChild(card);

    });


    /* 버튼 이름 변경 */

    document.getElementById("recommendBtn").innerText =
        "🔄 추천 다시 받기";


    /* 결과 위치로 이동 */

    setTimeout(() => {

        results.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 100);

}

</script>

</body>
</html>
