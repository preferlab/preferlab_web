<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>preferlab | Online Escape Room</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            color: #f5f2ff;
            font-family: "Noto Sans KR", Arial, sans-serif;

            /* 판타지풍 그라데이션 배경 */
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(111, 76, 180, 0.45) 0%,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 15%,
                    rgba(48, 92, 180, 0.35) 0%,
                    transparent 28%
                ),
                radial-gradient(
                    circle at 70% 80%,
                    rgba(136, 52, 154, 0.35) 0%,
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #080914 0%,
                    #11152d 45%,
                    #170f2b 100%
                );

            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* 은은한 중앙 빛 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(255, 255, 255, 0.05),
                    transparent 35%
                );

            z-index: 0;
        }

        /* 작은 별빛 */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.45) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle,
                    rgba(180,190,255,0.3) 1px,
                    transparent 1px
                );

            background-size: 120px 120px, 190px 190px;
            background-position: 10px 20px, 80px 100px;

            opacity: 0.25;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        /* 상단 */
        header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .logo {
            font-size: 20px;
            letter-spacing: 7px;
            color: rgba(255,255,255,0.75);
        }

        /* 메인 */
        main {
            min-height: calc(100vh - 140px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 60px 20px;
        }

        .main-content {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .subtitle {
            font-size: 13px;
            letter-spacing: 5px;
            color: rgba(220,215,255,0.65);
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(40px, 7vw, 72px);
            line-height: 1.2;
            font-weight: 300;
            letter-spacing: -3px;

            text-shadow:
                0 0 25px rgba(165,140,255,0.25);

            margin-bottom: 35px;
        }

        .welcome {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .prefer {
            font-size: 18px;
            color: rgba(255,255,255,0.65);
            margin-bottom: 55px;
        }

        /* 게임 목록 */
        .game-list {
            max-width: 700px;
            margin: 0 auto;
        }

        .game {
            padding: 35px 25px;

            border-top: 1px solid rgba(255,255,255,0.15);
            border-bottom: 1px solid rgba(255,255,255,0.15);

            background: rgba(10, 8, 25, 0.22);
            backdrop-filter: blur(8px);

            box-shadow:
                0 0 30px rgba(70, 50, 130, 0.08);
        }

        .game-title {
            font-size: 22px;
            font-weight: 400;
            letter-spacing: -0.5px;

            margin-bottom: 25px;
        }

        /* 시작하기 버튼 */
        .start-button {
            display: inline-block;

            padding: 13px 32px;

            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 3px;

            background: rgba(255,255,255,0.06);

            color: #ffffff;
            text-decoration: none;

            font-size: 14px;
            letter-spacing: 1px;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }

        .start-button:hover {
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.65);

            box-shadow:
                0 0 20px rgba(160,140,255,0.25);

            transform: translateY(-2px);
        }

        .start-button:active {
            transform: translateY(0);
        }

        /* 하단 */
        footer {
            text-align: center;
            padding: 30px 20px;

            color: rgba(255,255,255,0.3);
            font-size: 11px;
            letter-spacing: 2px;
        }

        /* 모바일 */
        @media (max-width: 600px) {

            header {
                padding: 22px 15px;
            }

            .logo {
                font-size: 16px;
                letter-spacing: 5px;
            }

            main {
                min-height: calc(100vh - 100px);
                padding: 45px 18px;
            }

            .subtitle {
                font-size: 10px;
                letter-spacing: 3px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: clamp(36px, 11vw, 48px);
                line-height: 1.25;
                letter-spacing: -2px;
                margin-bottom: 30px;
            }

            .welcome {
                font-size: 19px;
            }

            .prefer {
                font-size: 16px;
                margin-bottom: 45px;
            }

            .game {
                padding: 30px 18px;
            }

            .game-title {
                font-size: 19px;
                margin-bottom: 22px;
            }

            .start-button {
                width: 100%;
                padding: 14px 20px;
                font-size: 14px;
            }

            footer {
                padding: 25px 15px;
            }
        }
    </style>
</head>


<body>

<div class="page">

    <header>
        <div class="logo">
            환 영 합 니 다
        </div>
    </header>


    <main>

        <div class="main-content">

            <div class="subtitle">
                ONLINE ESCAPE ROOM
            </div>


            <h1>
                세상에 없던<br>
                새로운 방탈출
            </h1>

            <!-- 게임 목록 -->
            <div class="game-list">

                <div class="game">

                    <div class="game-title">
                        #1. 사라진 호텔의 비밀
                    </div>

                    <a
                        href="https://preferlab.co.kr/1start"
                        class="start-button"
                    >
                        시작하기
                    </a>

                </div>

            </div>

        </div>

    </main>


    <footer>
        제작 | prefer kim
    </footer>

</div>

</body>
</html>
