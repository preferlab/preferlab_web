<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리퍼연구소</title>

    <style>
        * {
            box-sizing: border-box;
        }

       body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans KR", sans-serif;
    color: #222;

    /* 밝고 은은한 판타지 그라데이션 */
    background:
        radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.9) 0%, transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(220, 235, 255, 0.8) 0%, transparent 30%),
        radial-gradient(circle at 20% 85%, rgba(240, 220, 255, 0.75) 0%, transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(255, 225, 240, 0.7) 0%, transparent 35%),
        linear-gradient(
            135deg,
            #eef8ff 0%,
            #f5f0ff 45%,
            #fff1f7 100%
        );

    background-attachment: fixed;
    min-height: 100vh;}

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 60px 20px 50px;
        }

        /* 헤더 */
        .header {
            text-align: center;
            margin-bottom: 45px;
        }

        .logo {
            display: inline-block;
            font-size: 14px;
            font-weight: 700;
            color: #777;
            background: #fff;
            padding: 7px 14px;
            border-radius: 30px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .subtitle {
            margin-top: 12px;
            font-size: 17px;
            color: #777;
            letter-spacing: -0.5px;
        }

        /* 메뉴 */
        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #222;
            background: #fff;
            padding: 22px 24px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
        }

        .menu a:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 25px rgba(0,0,0,0.10);
        }

        .number {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #999;
            margin-bottom: 6px;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .arrow {
            float: right;
            font-size: 20px;
            color: #aaa;
        }

        /* 추가 아이디어 */
        .coming {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #aaa;
        }

        /* 모바일 */
        @media (max-width: 480px) {
            .container {
                padding: 45px 16px 40px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 15px;
            }

            .menu a {
                padding: 20px;
                border-radius: 16px;
            }

            .title {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            <div class="logo">PREFER LAB</div>

            <h1>프리퍼연구소</h1>

            <div class="subtitle">
                당신의 시간을 날릴 최고의 방법
            </div>
        </header>


        <main class="menu">

            <a href="https://preferlab.co.kr/captcha">
                <span class="number">#1</span>
                <span class="title">로봇이 '절대' 아닙니다</span>
                <span class="arrow">›</span>
            </a>

            <a href="https://preferlab.co.kr/lunch">
                <span class="number">#2</span>
                <span class="title">뭐먹을래? 아무거나</span>
                <span class="arrow">›</span>
            </a>

            <a href="https://preferlab.co.kr/no">
                <span class="number">#3</span>
                <span class="title">세상 모든 거절 생성기</span>
                <span class="arrow">›</span>
            </a>

            <a href="https://preferlab.co.kr/calc">
                <span class="number">#4</span>
                <span class="title">그돈씨 계산기</span>
                <span class="arrow">›</span>
            </a>

            <a href="https://preferlab.co.kr/ball">
                <span class="number">#5</span>
                <span class="title">왁뿌볼 만들기</span>
                <span class="arrow">›</span>
            </a>

        </main>


        <div class="coming">
            추가 아이디어 생성중... 🧪
        </div>

    </div>

</body>
</html>
